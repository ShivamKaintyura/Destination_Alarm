<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destination Alarm</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#263041; --txt:#e6edf3; --dim:#8b98a9;
    --accent:#3fb950; --blue:#4a9eff; --danger:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  #map{position:fixed;inset:0;background:#141c26}
  .maplibregl-ctrl-attrib{font-size:10px;opacity:.5}

  #topbar{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  #searchWrap{flex:1;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 6px 24px rgba(0,0,0,.55)}
  #q{flex:1;background:none;border:0;color:var(--txt);font-size:15px;outline:none;min-width:0}
  #q::placeholder{color:var(--dim)}
  #searchBtn{border:0;border-radius:999px;padding:9px 16px;background:var(--accent);color:#04120a;
    font-weight:700;font-size:14px;cursor:pointer}
  #locBtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);font-size:18px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.55);flex:0 0 auto}

  #results{position:fixed;z-index:650;left:12px;right:12px;
    top:calc(66px + env(safe-area-inset-top));background:var(--panel);
    border:1px solid var(--line);border-radius:14px;display:none;
    box-shadow:0 18px 40px rgba(0,0,0,.6);max-height:46vh;overflow-y:auto;overflow-x:hidden}
  #results button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;
    border:0;border-bottom:1px solid var(--line);color:var(--txt);padding:12px 15px;cursor:pointer}
  #results button:last-child{border-bottom:0}
  #results button:active{background:#1f2733}
  #results .ico{font-size:17px;opacity:.85;flex:0 0 auto}
  #results .txt{min-width:0;flex:1}
  #results .main{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results .meta{margin-left:auto;font-size:11.5px;color:var(--dim);flex:0 0 auto}
  #results .hint{color:#5d6b7d;font-size:13px;cursor:default}

  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--panel);
    border-top:1px solid var(--line);border-radius:22px 22px 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 40px rgba(0,0,0,.6);max-height:66vh;overflow:auto}
  .grab{width:38px;height:4px;border-radius:2px;background:#2f3b4d;margin:0 auto 12px}
  .destRow{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
  .destRow .pin{font-size:20px}
  #destName{font-size:15px;font-weight:600;line-height:1.25}
  #destName.empty{color:var(--dim);font-weight:400}

  .seg{display:flex;gap:6px;background:#0f151d;border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:none;color:var(--dim);font-size:13px;font-weight:600;
    padding:9px 4px;border-radius:9px;cursor:pointer}
  .seg button.on{background:#243044;color:var(--txt)}

  .field{margin-bottom:16px}
  .fieldTop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .fieldTop label{font-size:13px;color:var(--dim);letter-spacing:.02em}
  .fieldTop b{font-size:14px;font-weight:700}
  input[type=range]{width:100%;height:28px;background:transparent;-webkit-appearance:none;appearance:none}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#243044}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;
    border-radius:50%;background:var(--accent);border:3px solid #0d1117;box-shadow:0 0 0 1px var(--accent)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#243044}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #0d1117}

  #status{display:none;gap:10px;margin-bottom:14px;text-align:center}
  #status.on{display:grid;grid-template-columns:1fr 1fr}
  .stat{background:#0f151d;border:1px solid var(--line);border-radius:12px;padding:10px 8px}
  .stat span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .stat strong{font-size:20px;font-variant-numeric:tabular-nums}
  #gpsNote{grid-column:1/-1;font-size:11.5px;color:var(--dim);line-height:1.4}

  .actions{display:flex;gap:10px}
  .btn{flex:1;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--accent);color:#04120a}
  .btn-primary:disabled{background:#25303f;color:#5d6b7d;cursor:not-allowed}
  .btn-stop{background:#3a1d20;color:#ff8f88;border:1px solid #5c2a2e}
  .btn-ghost{flex:0 0 auto;width:56px;background:#1b2330;color:var(--txt);border:1px solid var(--line);font-size:18px}

  .fine{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px;color:#5d6b7d;gap:10px}
  .fine span:last-child{text-align:right}

  /* alarm */
  #alarm{position:fixed;inset:0;z-index:9000;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 40%,#3a0d10,#0d0405 70%);animation:flash 1.1s infinite}
  #alarm.on{display:flex}
  @keyframes flash{0%,100%{background-color:#120506}50%{background-color:#3c0b10}}
  #alarm .bell{font-size:76px;animation:shake .55s infinite}
  @keyframes shake{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  #alarm h1{margin:0;font-size:30px;line-height:1.15}
  #alarm p{margin:8px 0 0;color:#d9a7a7;font-size:14px}
  #alarm .alarmBtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:10px}
  #alarm .alarmBtns .btn{padding:19px}
  #dismissBtn{background:#f2f5f8;color:#111}
  #snoozeBtn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.22)}

  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    z-index:9500;background:#f2f5f8;color:#111;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* map markers */
  .dest-pin{font-size:32px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.7));cursor:pointer}
  .me-dot{width:18px;height:18px;border-radius:50%;background:#4a9eff;border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(74,158,255,.18)}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div id="searchWrap">
    <input id="q" type="search" placeholder="Search a place or station…" autocomplete="off" enterkeyhint="search">
    <button id="searchBtn">Find</button>
  </div>
  <button id="locBtn" title="My location">◎</button>
</div>
<div id="results"></div>

<div id="sheet">
  <div class="grab"></div>

  <div class="destRow">
    <span class="pin">📍</span>
    <div id="destName" class="empty">Search or tap the map to set your destination</div>
  </div>

  <div id="status">
    <div class="stat"><span>Distance</span><strong id="sDist">—</strong></div>
    <div class="stat"><span>ETA</span><strong id="sEta">—</strong></div>
    <div id="gpsNote">Waiting for GPS…</div>
  </div>

  <div class="seg" id="modeSeg">
    <button data-mode="DRIVE" class="on">🚗 Drive</button>
    <button data-mode="TRANSIT">🚇 Transit</button>
    <button data-mode="WALK">🚶 Walk</button>
  </div>

  <div class="field">
    <div class="fieldTop"><label>Alarm radius</label><b id="rVal">500 m</b></div>
    <input id="radius" type="range" min="200" max="2000" step="100" value="500">
  </div>

  <div class="field">
    <div class="fieldTop"><label>Ring before arrival</label><b id="mVal">Off</b></div>
    <input id="mins" type="range" min="0" max="10" step="1" value="0">
  </div>

  <div class="actions">
    <button id="startBtn" class="btn btn-primary" disabled>Start alarm</button>
    <button id="testBtn" class="btn btn-ghost" title="Test the alarm">🔔</button>
  </div>

  <div class="fine">
    <span>Free maps · © OpenStreetMap</span>
    <span id="routeNote"></span>
  </div>
</div>

<div id="alarm">
  <div class="bell">⏰</div>
  <div>
    <h1 id="alarmTitle">You're here!</h1>
    <p id="alarmSub">Destination reached</p>
  </div>
  <div class="alarmBtns">
    <button id="dismissBtn" class="btn">Dismiss</button>
    <button id="snoozeBtn" class="btn">Snooze 5 min</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const PHOTON = 'https://photon.komoot.io/api/';
  const OSRM = {
    DRIVE: 'https://router.project-osrm.org/route/v1/driving/',
    WALK: 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/'
  };

  let map, mapReady = false;
  let dest = null;                 // { lat, lng, name }
  let destMarker = null, meMarker = null;
  let watchId = null;
  let state = 'idle';              // idle | armed | alarming
  let snoozeUntil = 0;
  let lastFix = null;
  let derivedSpeed = 0;
  let routeDuration = Infinity;
  let routeDistance = 0;
  let lastRouteAt = 0, routeBusy = false, routeSeq = 0;
  let travelMode = 'DRIVE';
  let audioCtx = null, beepTimer = null, vibTimer = null;
  let wakeLock = null;

  const radiusM = () => Number($('#radius').value);
  const minsBefore = () => Number($('#mins').value);

  /* ---------------- helpers ---------------- */
  function haversine(a, b) {
    const R = 6371000, t = Math.PI / 180;
    const dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function circleGeoJSON(center, radius) {
    const n = 72, earth = 6378137, rad = Math.PI / 180;
    const latRad = center.lat * rad;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const th = (i / n) * 2 * Math.PI;
      const dy = radius * Math.sin(th);
      const dx = radius * Math.cos(th);
      const lat = center.lat + (dy / earth) * (180 / Math.PI);
      const lng = center.lng + (dx / (earth * Math.cos(latRad))) * (180 / Math.PI);
      pts.push([lng, lat]);
    }
    return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [pts] } };
  }

  const emptyFC = () => ({ type: 'FeatureCollection', features: [] });

  function lineGeoJSON(coords) {
    return { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };
  }

  function fmtTime(sec) {
    if (!isFinite(sec)) return '—';
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m > 0 ? m + 'm ' + s + 's' : s + 's';
  }

  function iconFor(osmValue, name) {
    const v = (osmValue || '').toLowerCase();
    if (v.includes('station') || v.includes('subway')) return '🚇';
    if (v.includes('bus')) return '🚌';
    if (v.includes('airport')) return '✈️';
    if (v.includes('hospital') || v.includes('clinic')) return '🏥';
    if (v.includes('school') || v.includes('university') || v.includes('college')) return '🎓';
    if (v.includes('restaurant') || v.includes('cafe') || v.includes('fast_food')) return '🍽️';
    if (v.includes('hotel') || v.includes('guest_house')) return '🏨';
    if (v.includes('park')) return '🌳';
    if (v.includes('mall') || v.includes('marketplace')) return '🛍️';
    if (v.includes('bank') || v.includes('atm')) return '🏦';
    if (v.includes('fuel')) return '⛽';
    if (v.includes('temple') || v.includes('place_of_worship')) return '🛕';
    if (name && /station/i.test(name)) return '🚉';
    return '📌';
  }

  /* ---------------- map ---------------- */
  function initMap() {
    map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: [78.9629, 20.5937],
      zoom: 4.5,
      attributionControl: false,
      dragRotate: false,
      pitchWithRotate: false
    });

    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');

    map.on('load', () => {
      map.addSource('radius', { type: 'geojson', data: emptyFC() });
      map.addLayer({
        id: 'radius-fill', type: 'fill', source: 'radius',
        paint: { 'fill-color': '#3fb950', 'fill-opacity': 0.12 }
      });
      map.addLayer({
        id: 'radius-line', type: 'line', source: 'radius',
        paint: { 'line-color': '#3fb950', 'line-width': 2, 'line-opacity': 0.9 }
      });

      map.addSource('route', { type: 'geojson', data: emptyFC() });
      map.addLayer({
        id: 'route-line', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#4a9eff', 'line-width': 5, 'line-opacity': 0.9 }
      });
      map.addLayer({
        id: 'route-line-est', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' },
        paint: { 'line-color': '#8b98a9', 'line-width': 4, 'line-opacity': 0.8, 'line-dasharray': [2, 2] }
      });

      map.addSource('accuracy', { type: 'geojson', data: emptyFC() });
      map.addLayer({
        id: 'accuracy-fill', type: 'fill', source: 'accuracy',
        paint: { 'fill-color': '#4a9eff', 'fill-opacity': 0.10 }
      });
      map.addLayer({
        id: 'accuracy-line', type: 'line', source: 'accuracy',
        paint: { 'line-color': '#4a9eff', 'line-width': 1, 'line-opacity': 0.35 }
      });

      mapReady = true;
      if (dest) redrawDest();
      if (lastFix) drawFix(lastFix);
    });

    map.on('click', (e) => {
      const { lat, lng } = e.lngLat;
      setDestination(lat, lng, null);
      reverseGeocode(lat, lng);
    });

    map.on('error', (e) => {
      if (e && e.error && /style/i.test(String(e.error.message || ''))) {
        toast('Map style failed to load — check connection');
      }
    });

    navigator.geolocation?.getCurrentPosition(
      (p) => map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 13.5, duration: 900 }),
      () => {},
      { enableHighAccuracy: false, timeout: 8000 }
    );
  }

  function drawFix(fix) {
    if (!mapReady) return;
    const src = map.getSource('accuracy');
    if (src) src.setData(circleGeoJSON(fix, Math.max(fix.acc, 15)));

    if (!meMarker) {
      const el = document.createElement('div');
      el.className = 'me-dot';
      meMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([fix.lng, fix.lat]).addTo(map);
    } else {
      meMarker.setLngLat([fix.lng, fix.lat]);
    }
  }

  function redrawDest() {
    if (!mapReady || !dest) return;
    map.getSource('radius').setData(circleGeoJSON(dest, radiusM()));

    if (!destMarker) {
      const el = document.createElement('div');
      el.className = 'dest-pin';
      el.textContent = '📍';
      destMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([dest.lng, dest.lat]).addTo(map);
    } else {
      destMarker.setLngLat([dest.lng, dest.lat]);
    }
  }

  function setDestination(lat, lng, name, fly = true) {
    dest = { lat, lng, name: name || 'Dropped pin' };
    renderDestName();
    $('#startBtn').disabled = state !== 'idle';

    routeDuration = Infinity; routeDistance = 0; lastRouteAt = 0;
    clearRoute();
    redrawDest();

    if (fly) map.flyTo({ center: [lng, lat], zoom: 14.2, duration: 800 });
    refreshRoute(true);
    updateStatus();
  }

  function renderDestName() {
    const el = $('#destName');
    el.textContent = dest ? dest.name : 'Search or tap the map to set your destination';
    el.classList.toggle('empty', !dest);
  }

  function clearRoute() {
    if (!mapReady) return;
    map.getSource('route')?.setData(emptyFC());
    $('#routeNote').textContent = '';
  }

  function drawRoute(coords, estimated) {
    if (!mapReady) return;
    map.getSource('route').setData(lineGeoJSON(coords));
    map.setLayoutProperty('route-line', 'visibility', estimated ? 'none' : 'visible');
    map.setLayoutProperty('route-line-est', 'visibility', estimated ? 'visible' : 'none');
  }

  /* ---------------- reverse geocode (Nominatim) ---------------- */
  async function reverseGeocode(lat, lng) {
    try {
      const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=' +
        lat + '&lon=' + lng;
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      const j = await res.json();
      if (!dest) return;
      const a = j.address || {};
      const name = j.name || a.railway || a.bus_stop || a.amenity ||
        a.road || a.neighbourhood || a.suburb || a.city || j.display_name;
      if (name) { dest.name = String(name).split(',')[0]; renderDestName(); }
    } catch (e) { /* keep "Dropped pin" */ }
  }

  /* ---------------- search (Photon) ---------------- */
  let searchTimer = null, searchSeq = 0, searchCtrl = null;

  function onSearchInput() {
    clearTimeout(searchTimer);
    const q = $('#q').value.trim();
    if (q.length < 3) { $('#results').style.display = 'none'; return; }
    searchTimer = setTimeout(() => runSearch(q), 320);
  }

  async function runSearch(q) {
    if (!q) return;
    const seq = ++searchSeq;
    if (searchCtrl) searchCtrl.abort();
    searchCtrl = new AbortController();

    try {
      let url = PHOTON + '?limit=6&lang=en&q=' + encodeURIComponent(q);
      if (lastFix) url += '&lat=' + lastFix.lat + '&lon=' + lastFix.lng;

      const res = await fetch(url, { signal: searchCtrl.signal });
      const json = await res.json();
      if (seq !== searchSeq) return;

      const box = $('#results');
      box.innerHTML = '';
      const feats = (json.features || []).filter((f) => f.geometry);

      if (!feats.length) {
        box.innerHTML = '<button class="hint" disabled>No matches</button>';
        box.style.display = 'block';
        return;
      }

      feats.forEach((f) => {
        const p = f.properties || {};
        const name = p.name || p.street || p.city || 'Unnamed place';
        const parts = [p.street && p.street !== name ? p.street : null, p.district, p.city, p.state, p.country]
          .filter(Boolean);
        const sub = [...new Set(parts)].slice(0, 3).join(', ');

        const [lng, lat] = f.geometry.coordinates;
        const dist = lastFix ? haversine(lastFix, { lat, lng }) : null;

        const btn = document.createElement('button');
        const ico = document.createElement('span'); ico.className = 'ico';
        ico.textContent = iconFor(p.osm_value, name);
        const txt = document.createElement('span'); txt.className = 'txt';
        const main = document.createElement('span'); main.className = 'main'; main.textContent = name;
        const subEl = document.createElement('span'); subEl.className = 'sub'; subEl.textContent = sub;
        txt.append(main, subEl);
        const meta = document.createElement('span'); meta.className = 'meta';
        meta.textContent = dist !== null
          ? (dist < 1000 ? Math.round(dist) + ' m' : (dist / 1000).toFixed(1) + ' km')
          : '';

        btn.append(ico, txt, meta);
        btn.onclick = () => {
          box.style.display = 'none';
          $('#q').value = '';
          setDestination(lat, lng, name);
        };
        box.appendChild(btn);
      });

      box.style.display = 'block';
    } catch (e) {
      if (e.name === 'AbortError') return;
      const box = $('#results');
      box.innerHTML = '<button class="hint" disabled>Search unavailable — check connection</button>';
      box.style.display = 'block';
    }
  }

  /* ---------------- tracking ---------------- */
  function onFix(pos) {
    const c = pos.coords;
    const now = pos.timestamp || Date.now();
    const p = { lat: c.latitude, lng: c.longitude, t: now, speed: c.speed, acc: c.accuracy };

    if (lastFix) {
      const d = haversine(lastFix, p);
      const dt = (p.t - lastFix.t) / 1000;
      if (dt > 1) derivedSpeed = d / dt;
    }
    lastFix = p;

    drawFix(p);
    updateStatus();
    maybeRefreshRoute();
    evaluate();
  }

  function currentSpeed() {
    if (!lastFix) return 0;
    if (typeof lastFix.speed === 'number' && lastFix.speed >= 0) return lastFix.speed;
    return derivedSpeed;
  }

  function updateStatus() {
    const box = $('#status');
    if (!lastFix) { box.classList.remove('on'); return; }
    box.classList.add('on');

    if (!dest) {
      $('#sDist').textContent = '—';
      $('#sEta').textContent = '—';
      $('#gpsNote').textContent = 'GPS locked · accuracy ±' + Math.round(lastFix.acc) + ' m';
      return;
    }

    const straight = haversine(lastFix, dest);
    const v = currentSpeed();
    const eta = isFinite(routeDuration) ? routeDuration : fallbackEta(straight, v);

    $('#sDist').textContent = straight < 1000
      ? Math.round(straight) + ' m'
      : (straight / 1000).toFixed(2) + ' km';
    $('#sEta').textContent = fmtTime(eta) + (isFinite(routeDuration) ? '' : '*');

    const bits = ['±' + Math.round(lastFix.acc) + ' m', Math.round(v * 3.6) + ' km/h'];
    if (isFinite(routeDuration) && routeDistance) bits.push('route ' + (routeDistance / 1000).toFixed(1) + ' km');
    const age = (Date.now() - lastFix.t) / 1000;
    if (age > 45) bits.push('GPS stale ' + Math.round(age) + 's');
    if (lastFix.acc > 150) bits.push('weak signal');
    $('#gpsNote').textContent = bits.join(' · ');
  }

  function fallbackEta(straight, v) {
    if (travelMode === 'TRANSIT') return straight / (v > 3 ? v : 7);       // assume ~25 km/h in transit
    if (travelMode === 'WALK') return straight / (v > 0.8 ? v : 1.3);
    return v > 1 ? straight / v : Infinity;
  }

  /* ---------------- route ETA (OSRM) ---------------- */
  let routeOrigin = null;

  function maybeRefreshRoute() {
    if (!dest || !lastFix) return;
    const moved = routeOrigin ? haversine(lastFix, routeOrigin) : 999;
    if (Date.now() - lastRouteAt < 20000 && moved < 120) return;
    refreshRoute(false);
  }

  async function refreshRoute(force) {
    if (!dest || !lastFix) return;
    if (travelMode === 'TRANSIT') { drawTransitEstimate(); return; }
    if (routeBusy) return;
    if (!force && Date.now() - lastRouteAt < 15000) return;

    routeBusy = true;
    const seq = ++routeSeq;
    routeOrigin = { lat: lastFix.lat, lng: lastFix.lng };
    lastRouteAt = Date.now();

    const base = OSRM[travelMode];
    const coords = `${lastFix.lng},${lastFix.lat};${dest.lng},${dest.lat}`;
    const url = base + coords + '?overview=full&geometries=geojson&alternatives=false&steps=false';

    try {
      const res = await fetch(url);
      const json = await res.json();
      if (seq !== routeSeq) return;
      if (!json.routes || !json.routes.length) throw new Error(json.code || 'no route');

      const r = json.routes[0];
      routeDuration = r.duration;
      routeDistance = r.distance;
      drawRoute(r.geometry.coordinates, false);
      $('#routeNote').textContent = 'Route ETA · OSRM';
      updateStatus();
    } catch (e) {
      routeDuration = Infinity;
      routeDistance = 0;
      drawTransitEstimate();
      $('#routeNote').textContent = 'Estimate only';
      updateStatus();
    } finally {
      routeBusy = false;
    }
  }

  function drawTransitEstimate() {
    if (!dest || !lastFix) return;
    const straight = haversine(lastFix, dest);
    routeDuration = fallbackEta(straight, currentSpeed());
    routeDistance = straight;
    drawRoute([[lastFix.lng, lastFix.lat], [dest.lng, dest.lat]], true);
    $('#routeNote').textContent = 'Estimate · no live transit';
    updateStatus();
  }

  /* ---------------- start / stop ---------------- */
  function start() {
    if (!dest || state !== 'idle') return;

    unlockAudio();
    state = 'armed';
    snoozeUntil = 0;
    setStartButton(true);
    $('#testBtn').style.visibility = 'hidden';

    if (!('geolocation' in navigator)) { toast('Geolocation not supported'); stop(); return; }

    watchId = navigator.geolocation.watchPosition(onFix, onGeoError, {
      enableHighAccuracy: true, maximumAge: 5000, timeout: 20000
    });

    if (lastFix) refreshRoute(true);
    requestWakeLock();
    toast('Tracking started — keep this tab open');
  }

  function stop() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    stopBeeps();
    state = 'idle';
    hideAlarm();
    setStartButton(false);
    $('#testBtn').style.visibility = 'visible';
    releaseWakeLock();
  }

  function setStartButton(running) {
    const b = $('#startBtn');
    b.textContent = running ? 'Stop' : 'Start alarm';
    b.classList.toggle('btn-primary', !running);
    b.classList.toggle('btn-stop', running);
    b.disabled = !running && !dest;
  }

  function onGeoError(err) {
    toast('Location error: ' + err.message);
    if (err.code === 1) stop();
  }

  /* ---------------- trigger ---------------- */
  function evaluate() {
    if (state !== 'armed' || !dest || !lastFix) return;
    if (Date.now() < snoozeUntil) return;

    const d = haversine(lastFix, dest);
    const acc = lastFix.acc;
    const reliable = acc <= 150 || d <= acc * 1.5;

    if (d <= radiusM() && reliable) {
      trigger('Destination reached', Math.round(d) + ' m away');
      return;
    }

    const mb = minsBefore();
    if (mb > 0) {
      const eta = isFinite(routeDuration) ? routeDuration : fallbackEta(d, currentSpeed());
      if (isFinite(eta) && eta <= mb * 60) {
        trigger('Almost there', 'About ' + fmtTime(eta) + ' to destination');
      }
    }
  }

  function trigger(title, sub) {
    state = 'alarming';
    $('#alarmTitle').textContent = title;
    $('#alarmSub').textContent = sub;
    $('#alarm').classList.add('on');
    startBeeps();
    startVibration();
  }

  function dismiss() { stop(); toast('Alarm dismissed'); }

  function snooze() {
    stopBeeps();
    hideAlarm();
    state = 'armed';
    snoozeUntil = Date.now() + 5 * 60 * 1000;
    toast('Snoozed for 5 minutes');
  }

  function hideAlarm() { $('#alarm').classList.remove('on'); }

  /* ---------------- sound / vibration ---------------- */
  function unlockAudio() {
    if (audioCtx) { audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }

  function beep() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    for (let i = 0; i < 2; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const at = t + i * 0.24;
      o.type = 'square';
      o.frequency.setValueAtTime(i ? 880 : 1180, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.75, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.19);
      o.connect(g).connect(audioCtx.destination);
      o.start(at); o.stop(at + 0.2);
    }
  }

  function startBeeps() { unlockAudio(); beep(); beepTimer = setInterval(beep, 1100); }

  function stopBeeps() {
    if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
    if (vibTimer) { clearInterval(vibTimer); vibTimer = null; }
    if (navigator.vibrate) navigator.vibrate(0);
  }

  function startVibration() {
    if (!navigator.vibrate) return;
    const pattern = [600, 200, 600, 200, 600, 500];
    navigator.vibrate(pattern);
    vibTimer = setInterval(() => navigator.vibrate(pattern), 3200);
  }

  /* ---------------- wake lock ---------------- */
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
    catch (e) { /* ignore */ }
  }
  function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state === 'armed' && !wakeLock) requestWakeLock();
  });

  /* ---------------- ui ---------------- */
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
  }

  function wire() {
    $('#q').addEventListener('input', onSearchInput);
    $('#q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); runSearch($('#q').value.trim()); }
    });
    $('#searchBtn').onclick = () => runSearch($('#q').value.trim());

    $('#locBtn').onclick = () => {
      navigator.geolocation.getCurrentPosition(
        (p) => map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 16, duration: 800 }),
        () => toast('Could not get your location'),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    };

    $('#radius').oninput = (e) => {
      $('#rVal').textContent = e.target.value + ' m';
      if (dest) redrawDest();
      if (state === 'armed') evaluate();
    };
    $('#mins').oninput = (e) => {
      const m = Number(e.target.value);
      $('#mVal').textContent = m === 0 ? 'Off' : m + ' min';
      if (state === 'armed') evaluate();
    };

    $('#modeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b) return;
      travelMode = b.dataset.mode;
      [...$('#modeSeg').children].forEach((x) => x.classList.toggle('on', x === b));
      lastRouteAt = 0;
      if (dest) refreshRoute(true);
    });

    $('#startBtn').onclick = () => { state === 'idle' ? start() : stop(); };
    $('#testBtn').onclick = () => trigger('Test alarm', 'This is how it will sound');
    $('#dismissBtn').onclick = dismiss;
    $('#snoozeBtn').onclick = snooze;

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchWrap') && !e.target.closest('#results')) {
        $('#results').style.display = 'none';
      }
    });

    setInterval(updateStatus, 1000);
  }

  wire();
  initMap();
})();
</script>
</body>
</html>
